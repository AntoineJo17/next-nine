<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype gestes</title>
<style>:root{--bg:#0e1a17;--fg:#e8f1ec;--mut:#8aa59a;--lime:#d3f96a;--blue:#63b9f4;--red:#ff7d6e}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui}main{max-width:760px;margin:auto;padding:12px 16px}
h1{font-size:18px}canvas{width:100%;background:#12251f;border-radius:10px;touch-action:none;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button,select{background:#1c3a31;color:var(--fg);border:1px solid #2f5a4c;border-radius:8px;min-height:44px;padding:0 12px;font:inherit}button.on{border-color:var(--lime);color:var(--lime)}p{color:var(--mut);margin:6px 0}#out{white-space:pre-wrap;color:var(--fg);background:#0a1411;border-radius:8px;padding:8px;font:12px ui-monospace,monospace}</style></head><body><main>
<h1>Prototype : du geste au ballon (isolé, ne touche pas au jeu)</h1>
<p>Dessine un geste dans la zone du bas (le ballon est le rond). Vue du dessus en haut, vue de profil au milieu. Le point de départ sur le ballon (clic sur le petit ballon) règle l'effet et la hauteur.</p>
<div class="row" id="props"><button data-p="A" class="on">A · Balayage</button><button data-p="B">B · Fronde</button><button data-p="C">C · Deux temps</button><button id="fk">Coup franc : off</button><select id="skill"><option value="1.2">Technique 1,2</option><option value="1" selected>Technique 1,0</option><option value=".7">Technique 0,7</option></select><select id="stress"><option value="0">Sans pression</option><option value=".5">Pression</option></select></div>
<canvas id="top" width="720" height="360"></canvas><canvas id="side" width="720" height="200" style="margin-top:8px"></canvas>
<div class="row"><canvas id="ball" width="140" height="140" style="width:110px"></canvas><canvas id="pad" width="560" height="300" style="flex:1;min-width:240px"></canvas></div>
<div class="row"><button id="many">80 tirs avec ce geste</button><button id="clr">Effacer</button></div><div id="out">Dessine un geste.</div>
<script src="sim.js"></script><script>
const S=window.NNGest,$=id=>document.getElementById(id);let prop='A',fk=false,contact={ox:0,oy:0},pts=[],last=null,aim={x:0,z:-20},seed=1;
const tp=$('top').getContext('2d'),side=$('side').getContext('2d'),pad=$('pad'),pc=pad.getContext('2d'),ball=$('ball').getContext('2d');
const ctxP=()=>({x:fk?-6:0,z:fk?-8:-2,contact,freekick:fk,aim});
function drawBall(){ball.clearRect(0,0,140,140);ball.fillStyle='#fff';ball.beginPath();ball.arc(70,70,56,0,7);ball.fill();ball.strokeStyle='#999';for(const r of[18,37])ball.strokeRect(70-r,70-r,2*r,2*r);ball.fillStyle='#d33';ball.beginPath();ball.arc(70+contact.ox*56,70+contact.oy*56,7,0,7);ball.fill();}
function drawPad(){pc.clearRect(0,0,560,300);pc.fillStyle='#d3f96a22';pc.fillRect(0,0,560,300);pc.fillStyle='#fff';pc.beginPath();pc.arc(280,255,14,0,7);pc.fill();pc.strokeStyle='#d3f96a';pc.lineWidth=3;pc.beginPath();pts.forEach((p,i)=>i?pc.lineTo(p.x,p.y):pc.moveTo(p.x,p.y));pc.stroke();}
function W(x,z){return [360+x*10,330-(z+25)*6.4]}
function drawTop(r){tp.clearRect(0,0,720,360);tp.fillStyle='#1d4a32';tp.fillRect(0,0,720,360);tp.strokeStyle='#fff6';tp.lineWidth=1;tp.strokeRect(...W(-34,-20).concat([680,0]).slice(0,2),680,1);
 tp.strokeStyle='#fff';tp.beginPath();let a=W(-3.66,-20),b=W(3.66,-20);tp.moveTo(a[0],a[1]);tp.lineTo(b[0],b[1]);tp.stroke();tp.fillStyle='#fff3';a=W(-18,-3.5);tp.fillRect(a[0],W(0,-20)[1],360,W(0,-3.5)[1]-W(0,-20)[1]);
 if(!r)return;tp.strokeStyle='#d3f96a';tp.lineWidth=2;tp.beginPath();r.flight.pts.forEach((p,i)=>{const q=W(p.x,p.z);i?tp.lineTo(q[0],q[1]):tp.moveTo(q[0],q[1])});tp.stroke();const s=W(r.launch.x,r.launch.z);tp.fillStyle='#63b9f4';tp.beginPath();tp.arc(s[0],s[1],5,0,7);tp.fill();}
function drawSide(r){side.clearRect(0,0,720,200);side.fillStyle='#10201b';side.fillRect(0,0,720,200);if(!r)return;const f=r.flight,z0=r.launch.z,zmin=Math.min(...f.pts.map(p=>p.z)),span=Math.max(30,z0-zmin+4),sx=680/span;side.strokeStyle='#fff';side.beginPath();side.moveTo(0,180);side.lineTo(720,180);side.stroke();
 const gz=(z0-(-20))*sx+20;side.strokeStyle='#ff7d6e';side.strokeRect(gz-2,180-2.44*30,4,2.44*30);side.strokeStyle='#d3f96a';side.lineWidth=2;side.beginPath();f.pts.forEach((p,i)=>{const x=(z0-p.z)*sx+20,y=180-p.y*30;i?side.lineTo(x,y):side.moveTo(x,y)});side.stroke();}
function run(){if(pts.length<4)return;const r=S.play(prop,pts.map(p=>({x:p.x-280,y:p.y-255,t:p.t})),ctxP(),{skill:+$('skill').value,stress:+$('stress').value,seed});last=r;drawTop(r);drawSide(r);const g=r.flight.goal,q=r.gesture;
 $('out').textContent=`Geste : ${q.len.toFixed(0)} px en ${q.dur.toFixed(0)} ms (${q.speed.toFixed(0)} px/s), courbure ${(q.turn*57.3).toFixed(0)}°, tremblement ${(q.tremor*100).toFixed(1)} %\nBallon : ${r.params.v0.toFixed(1)} m/s, élévation ${(r.params.elev*57.3).toFixed(0)}°, effet ${r.params.wy.toFixed(0)} rad/s, ${r.launch.knuckle?'BALLE SANS EFFET · ':''}\nRésultat : ${g?(g.inside?'BUT (non gardé)':g.over?'au-dessus':'à côté')+' x='+g.x.toFixed(1)+' m, h='+g.y.toFixed(1)+' m':'ne franchit pas la ligne ; apogée '+r.flight.apex.toFixed(1)+' m'}`;}
let down=false,t0=0;pad.addEventListener('pointerdown',e=>{down=true;pts=[];t0=performance.now();pad.setPointerCapture(e.pointerId);add(e)});pad.addEventListener('pointermove',e=>{if(down)add(e)});pad.addEventListener('pointerup',()=>{down=false;seed++;run()});
function add(e){const r=pad.getBoundingClientRect();pts.push({x:(e.clientX-r.left)/r.width*560,y:(e.clientY-r.top)/r.height*300,t:performance.now()-t0});drawPad()}
$('ball').addEventListener('pointerdown',e=>{const r=$('ball').getBoundingClientRect();contact={ox:Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width*140-70)/56)),oy:Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height*140-70)/56))};drawBall();run()});
document.querySelectorAll('#props [data-p]').forEach(b=>b.onclick=()=>{prop=b.dataset.p;document.querySelectorAll('#props [data-p]').forEach(x=>x.classList.toggle('on',x===b));run()});
$('fk').onclick=()=>{fk=!fk;$('fk').textContent='Coup franc : '+(fk?'on':'off');$('fk').classList.toggle('on',fk);run()};$('clr').onclick=()=>{pts=[];drawPad();drawTop();drawSide();$('out').textContent='Dessine un geste.'};
$('many').onclick=()=>{if(pts.length<4)return;const c={goal:0,wide:0,over:0,short:0},g=pts.map(p=>({x:p.x-280,y:p.y-255,t:p.t}));for(let s=1;s<=80;s++){const r=S.play(prop,g,ctxP(),{skill:+$('skill').value,stress:+$('stress').value,seed:s*31}).flight.goal;if(!r)c.short++;else if(r.inside)c.goal++;else if(r.over)c.over++;else c.wide++}$('out').textContent+=`\n80 tirs : ${c.goal} dans le cadre · ${c.wide} à côté · ${c.over} au-dessus · ${c.short} sans atteindre la ligne (sans gardien)`};
drawBall();drawPad();drawTop();drawSide();</script></main></body></html>
